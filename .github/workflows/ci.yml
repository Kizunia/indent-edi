name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: client

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: indent_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3307/indent_test
          DATABASE_URL_TEST: mysql://root:password@127.0.0.1:3307/indent_test
        run: |
          npx prisma migrate deploy
          npm run test:int
      - run: npm run build
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3307/indent_test
